<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Marvel Order</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="nebula red"></div>
        <div class="nebula blue"></div>
        <div class="nebula purple"></div>

        <div class="stars"></div>
        <div class="particles"></div>

        <div class="easter shield"></div>
        <div class="easter hammer"></div>
        <div class="easter reactor"></div>
    </div>


    <!-- Navbar -->

    <header>

        <h1 class="logo">

            THE MARVEL ORDER

        </h1>

    </header>



    <!-- Hero -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <h2>

                    THE UNIVERSE
                    <br>
                    AWAITS.

                </h2>

                <p>

                    <span> Your complete guide through the Marvel Cinematic
                        Universe.</span>
                    <br>

                    Select your path into the MCU.

                </p>

                <div class="hero-buttons">

                    <a href="release.html" class="btn btn-release">

                        Release Order

                    </a>

                    <a href="chrono.html" class="btn btn-chrono">

                        Chronological Order

                    </a>

                </div>

            </div>


            <div class="hero-image">

                <div class="portal">

                    <div class="portal-glow"></div>

                    <img src="stan.png" alt="Stan Lee" class="stan">

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
