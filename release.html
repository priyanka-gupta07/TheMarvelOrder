<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MarvelOrder | Release</title>

    <link rel="stylesheet" href="release.css">

</head>

<body>

     <div id="cursor-glow"></div>
    <div id="star-field"></div>
    <div class="cosmic-nebula"></div>

    <a href="index.html" class="back-btn">← Back</a>

    <div class="constellation constellation-1">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="constellation constellation-2">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="constellation constellation-3">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
   

    

    <main class="release-page">

        <section class="release-hero">

    <p class="eyebrow">THE MARVEL SAGA</p>

    <h1>RELEASE ORDER</h1>

    <div class="hero-divider"></div>

    <p class="hero-tagline">
        SIX ERAS.
        <span>ONE UNIVERSE.</span>
    </p>

    <div class="cosmic-mark">
    ✦
</div>

    <p class="instruction">
    SELECT A PHASE
</p>

</section>

        <section class="phase-selector">

            <div class="energy-trails">
    <span class="trail trail-power"></span>
    <span class="trail trail-space"></span>
    <span class="trail trail-reality"></span>
    <span class="trail trail-mind"></span>
    <span class="trail trail-time"></span>
    <span class="trail trail-soul"></span>
</div>

            <div class="stone-orbit">

                <button class="stone stone-1" data-phase="1">
                    <img src="assets/power-stone.png" alt="Phase 1">
                    <span>PHASE I</span>
                </button>

                <button class="stone stone-2" data-phase="2">
                    <img src="assets/mind-stone.png" alt="Phase 2">
                    <span>PHASE II</span>
                </button>

                <button class="stone stone-3" data-phase="3">
                    <img src="assets/time-stone.png" alt="Phase 3">
                    <span>PHASE III</span>
                </button>

                <button class="stone stone-4" data-phase="4">
                    <img src="assets/soul-stone.png" alt="Phase 4">
                    <span>PHASE IV</span>
                </button>

                <button class="stone stone-5" data-phase="5">
                    <img src="assets/space-stone.png" alt="Phase 5">
                    <span>PHASE V</span>
                </button>

                <button class="stone stone-6" data-phase="6">
                    <img src="assets/reality-stone.png" alt="Phase 6">
                    <span>PHASE VI</span>
                </button>

            </div>

        </section>

        <section id="phase-content" class="phase-content"></section>

    </main>

    <script src="release.js"></script>

</body>
</html>
